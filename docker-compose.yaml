version: '3.8'

networks:
  home-server:
    external: true

services:
  home_web_socket:
    build: .
    container_name: home_web_socket
    ports:
      - 8765:8765
    networks:
      - home-server
    environment:
      CONFIG_FILE: /run/secrets/config.json
    volumes:
      - .:/app  # Mount current directory to /app in the container
    env_file:
      - .env 
    restart: always  # Restart if the container crashes
    command: ["python", "-u", "index.py"]
    privileged: true

