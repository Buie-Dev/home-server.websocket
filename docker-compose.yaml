version: '3.8'

networks:
  home-server:
    external: true

services:
  websocket:
    build:
      context: .
      network: host
    container_name: websocket
    ports:
      - 8765:8765
    expose:
      - 8765
    networks:
      - home-server
    environment:
      CONFIG_FILE: /run/secrets/config.json
    volumes:
      - .:/app  # Mount current directory to /app in the container
    env_file:
      - .env 
    restart: always  # Restart if the container crashes
    command: ["python", "-u", "index.py"]
    privileged: true

